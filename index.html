<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>West Parker's Links</title>

<link href="https://fonts.googleapis.com/css?family=Cabin|Roboto:400,700|Roboto+Condensed:400,700" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<link rel="stylesheet" href="/styles.css">

</head>

<body>
  <div class="main-container">

    <div class="image-row">
      <img src="/thumbnails/profile-pic.jpg" alt="West Parker headshot" class="avatar-image">
    </div>

    <div class="name-row">
      West Parker
    </div>

    <div class="social-icons-row">
      <a href="https://github.com/westparker" target="_blank"><i class="fa-brands fa-github"></i></a>
      <a href="https://www.linkedin.com/in/westleeparker/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
      <a href="https://www.instagram.com/" target="_blank"><i class="fa-brands fa-square-instagram"></i></a>
      <a href="https://www.INSERT-REAL-LINK" target="_blank"><i class="fa-solid fa-globe"></i></a>
    </div> <!-- social-icons-row -->

    <div class="links-row">
      <a class="item" target="_blank" href="https://github.com/westparker/link-in-bio">
        <img class="thumbnail" src="/thumbnails/git.jpg" alt="GitHub latest project">
        <span class="link-text">
          Latest Github Project
        </span>
      </a>

      <a class="item" target="_blank" href="https://www.substack.com">
        <img class="thumbnail" src="/thumbnails/substack.png" alt="Substack blog latest post">
        <span class="link-text">
          Latest Blog Post - Coming Soon
        </span>
      </a>

      <a class="item" target="_blank" href="https://www.amazon.com">
        <img class="thumbnail" src="/thumbnails/amazon.jpg" alt="Amazon shopping links">
        <span class="link-text">
          Amazon Shopping Recs - Coming Soon
        </span>
      </a>

      <a class="item" target="_blank" href="https://www.americanexpress.com/">
        <img class="thumbnail" src="/thumbnails/amex.jpg" alt="Amex card referral">
        <span class="link-text">
          Link to Amex Card Referral - Coming Soon
        </span>
      </a>
    </div>
     <!-- links-row -->
<footer class="footer-row">
  <a href="/about.html">About me</a>
</footer>

  </div> <!-- main-container -->
</body>

</html>

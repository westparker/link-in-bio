<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>West Parker's Links</title>

  <style>
    * {
      border: 1px red dashed;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100%;
      padding-top: 40px;
      padding-bottom: 40px;
      color: rgba(0, 0, 0, 1);
      background: conic-gradient(from 0deg at 100% 10%, #96745d, #ad8460, #c39463, #d7a766, #e9ba6c, #f7cf7c, #fde6a5, #fffbe9);
    }

    a {
      color: rgba(0, 0, 0, 1);
    }

    .main-container {
      max-width: 640px;
      margin: auto;
    }

    .avatar-image {
      width: 128px;
      height: 128px;
      object-fit: cover;
      border-radius: 128px;
    }

    .thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 48px;
      object-fit: cover;
    }

    .image-row {
      margin-bottom: 20px;
      text-align: center;
    }

    .name-row {
      margin-bottom: 30px;
      text-align: center;
    }

    .social-icons-row {
      margin-bottom: 30px;
      display: flex;
      justify-content: space-around;
    }

    .item {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      background-color: rgba(222, 170, 6, 0.95);
    }

    .link-text {
      text-align: center;
      flex-grow: 1;
    }
  </style>
</head>

<body>
  <div class="main-container">

    <div class="image-row">
      <img src="/thumbnails/profile-pic.jpg" alt="West Parker headshot" class="avatar-image">
    </div>

    <div class="name-row">
      West Parker
    </div>

    <div class="social-icons-row">
      <a href="https://github.com/westparker" target="_blank">Github</a>
      <a href="https://www.linkedin.com/in/westleeparker/" target="_blank">LinkedIn</a>
      <a href="https://www.instagram.com/westp77_/" target="_blank">Instagram</a>
      <a href="https://www.INSERT-REAL-LINK" target="_blank">Personal Website - Coming Soon</a>
    </div> <!-- social-icons-row -->

    <div class="links-row">
      <a class="item" target="_blank" href="https://github.com/westparker/link-in-bio">
        <img class="thumbnail" src="/thumbnails/git.jpg" alt="GitHub latest project">
        <span class="link-text">
          Latest Github Project
        </span>
      </a>

      <a class="item" target="_blank" href="https://www.substack.com">
        <img class="thumbnail" src="/thumbnails/substack.png" alt="Substack blog latest post">
        <span class="link-text">
          Latest Blog Post - Coming Soon
        </span>
      </a>

      <a class="item" target="_blank" href="https://www.amazon.com">
        <img class="thumbnail" src="/thumbnails/amazon.jpg" alt="Amazon shopping links">
        <span class="link-text">
          Amazon Shopping Links - Coming Soon
        </span>
      </a>

      <a class="item" target="_blank" href="https://www.amex.com">
        <img class="thumbnail" src="/thumbnails/amex.jpg" alt="Amex card referral">
        <span class="link-text">
          Link to Amex Card Referral - Coming Soon
        </span>
      </a>
    </div>
     <!-- links-row -->


  </div> <!-- main-container -->
</body>

</html>

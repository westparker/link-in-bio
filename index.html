<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>West Parker's Links</title>

  <style>
    * {
      border: 1px red dashed;
    }

    body {
      padding-top: 40px;
      padding-bottom: 40px;
    }

    .avatar-image {
      width: 128px;
      height: 128px;
      object-fit: cover;
      border-radius: 128px;
    }

    .thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 48px;
      object-fit: cover;
    }

    /* Other declarations */
  </style>
</head>

<body>
  <div class="main-container">

    <div class="image-row">
      <img src="/thumbnails/profile-pic.jpg" alt="West Parker headshot" class="avatar-image">
    </div>

    <div class="name-row">
      West Parker
    </div>

    <div class="social-icons-row">
      <a href="https://github.com/westparker" target="_blank">
        Github
      </a>

      <a href="https://www.linkedin.com/in/westleeparker/" target="_blank">
        LinkedIn
      </a>

      <a href="https://www.instagram.com/westp77_/" target="_blank">
        Instagram
      </a>

      <a href="https://www.INSERT-REAL-LINK" target="_blank">
        Personal Website - Coming Soon
      </a>
    </div> <!-- social-icons-row -->

    <div class="links-row">
      <div class="item">
        <img src="/thumbnails/git.jpg" alt="GitHub latest project" class="thumbnail">
        <a target="_blank" href="https://github.com/westparker/link-in-bio">
          Latest Github Project
        </a>
      </div>

      <div class="item">
        <img src="/thumbnails/substack.png" alt="Substack blog latest post" class="thumbnail">
        <a target="_blank" href="https://www.substack.com">
          Latest Blog Post - Coming Soon
        </a>
      </div>

      <div class="item">
        <img src="/thumbnails/amazon.jpg" alt="Amazon shopping links" class="thumbnail">
        <a target="_blank" href="https://www.amazon.com">
          Amazon Shopping Links - Coming Soon
        </a>
      </div>

      <div class="item">
        <img src="/thumbnails/amex.jpg" alt="Amex card referral" class="thumbnail">
        <a target="_blank" href="https://www.amex.com">
          Link to Amex Card Referral - Coming Soon
        </a>
      </div>
    </div> <!-- links-row -->

  </div> <!-- main-container -->
</body>

</html>
